name: Build ProxiChat (Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Android APK ──
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project scaffold
      working-directory: .
      run: |
        cd flutter_app
        flutter create --org com.proxichat --project-name proxichat --platforms android,ios .

    - name: Apply Android permissions
      run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

    - name: Fix Android Gradle for plugin compatibility
      run: |
        # Set compileSdk/minSdk in android/app/build.gradle
        sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts 2>/dev/null || \
        sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true

        sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle.kts 2>/dev/null || \
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle 2>/dev/null || true

        # Add ext block to root build.gradle so plugins can find flutter.compileSdkVersion
        if [ -f android/build.gradle ]; then
          cat >> android/build.gradle << 'GRADLEOF'

        subprojects {
            afterEvaluate { project ->
                if (project.plugins.hasPlugin("com.android.library")) {
                    project.android {
                        compileSdk = 34
                        if (namespace == null) {
                            namespace = project.group.toString()
                        }
                    }
                }
            }
        }
        GRADLEOF
        fi

        if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts << 'GRADLEOF'

        subprojects {
            afterEvaluate {
                if (plugins.hasPlugin("com.android.library")) {
                    extensions.configure<com.android.build.gradle.LibraryExtension> {
                        compileSdk = 34
                        if (namespace == null) {
                            namespace = project.group.toString()
                        }
                    }
                }
            }
        }
        GRADLEOF
        fi

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProxiChat-Android
        path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  # ── iOS IPA ──
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project scaffold
      working-directory: .
      run: |
        cd flutter_app
        flutter create --org com.proxichat --project-name proxichat --platforms android,ios .

    - name: Apply iOS permissions
      run: cp ios_overrides/Info.plist ios/Runner/Info.plist

    - name: Set iOS deployment target
      run: |
        cd ios
        sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" Runner.xcodeproj/project.pbxproj

    - name: Install CocoaPods
      run: cd ios && pod install --repo-update || true

    - name: Get dependencies
      run: flutter pub get

    - name: Build iOS (no codesign)
      run: flutter build ios --release --no-codesign

    - name: Create IPA
      run: |
        mkdir -p stage/Payload
        cp -r build/ios/iphoneos/Runner.app stage/Payload/
        cd stage
        zip -r -y ../ProxiChat.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ProxiChat-iOS
        path: flutter_app/ProxiChat.ipa
