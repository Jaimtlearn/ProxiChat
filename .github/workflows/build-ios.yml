name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build ProxiChat
      working-directory: ios
      run: |
        xcodebuild build \
          -project ProxiChat.xcodeproj \
          -target ProxiChat \
          -sdk iphoneos \
          -configuration Release \
          CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Verify build output
      run: |
        echo "=== .app contents ==="
        ls -la build/ProxiChat.app/
        echo "=== Checking executable ==="
        file build/ProxiChat.app/ProxiChat
        echo "=== Info.plist ==="
        cat build/ProxiChat.app/Info.plist | head -30

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/ProxiChat.app Payload/
        cd Payload && zip -r ../ProxiChat.ipa ProxiChat.app
        cd ..
        echo "=== IPA contents ==="
        unzip -l ProxiChat.ipa | head -20
        echo "=== IPA size ==="
        ls -lh ProxiChat.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ProxiChat-iOS
        path: ProxiChat.ipa
