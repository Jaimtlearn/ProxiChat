name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub website

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build ProxiChat
      working-directory: ios
      run: |
        xcodebuild build \
          -project ProxiChat.xcodeproj \
          -target ProxiChat \
          -sdk iphoneos \
          -configuration Release \
          CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/ProxiChat.app Payload/
        zip -r ProxiChat.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ProxiChat-iOS
        path: ProxiChat.ipa
